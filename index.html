<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>保质期到期提醒</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system}
body{background:#f5f5f7;padding:10px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #00000015}
h3{margin-bottom:10px;color:#222;font-size:17px}
input,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px;font-size:16px}
button{padding:9px;border:none;border-radius:8px;font-size:15px;cursor:pointer}
.btn-add{width:100%;background:#2774ed;color:#fff;margin:6px 0}
.btn-del{background:#ed4343;color:#fff;width:48%}
.btn-edit{background:#32b858;color:#fff;width:48%}
.btn-save{background:#2774ed;color:#fff;width:100%;margin:6px 0}
.btn-cancel{background:#888;color:#fff;width:100%}
.btn-row{display:flex;gap:4px;margin-top:8px}
.warn-item{background:#fff1f1;border:2px solid #ff6b6b;border-radius:8px;padding:12px;margin:8px 0}
.normal-item{padding:12px;border-bottom:1px solid #eee;margin:6px 0}
.empty{padding:10px;color:#777;text-align:center}
.edit-form{background:#eef8ff;padding:12px;border-radius:8px;margin:10px 0;border:1px solid #bde0ff}
</style>
</head>
<body>
<div class="card">
<h3>➕ 添加商品</h3>
<input placeholder="商品名称" id="name">
<input type="date" id="produceDate">
<input type="number" placeholder="保质期时长" id="shelfNum" min="1">
<select id="unit">
<option value="month">保质期单位：月</option>
<option value="day">保质期单位：天</option>
</select>
<button class="btn-add" onclick="addItem()">添加记录</button>
</div>

<div class="card">
<h3>⚠️ 预警（不足30天到期）</h3>
<div id="warnList"></div>
</div>

<div class="card">
<h3>📋 全部商品记录</h3>
<div id="allList"></div>
</div>

<script>
let editIndex = null;

function getList(){
  try{
    const raw = localStorage.getItem("snackListMobile");
    return raw ? JSON.parse(raw) : [];
  }catch(e){
    return [];
  }
}
function save(arr){
  try{
    localStorage.setItem("snackListMobile", JSON.stringify(arr));
  }catch(e){}
}

function calcEnd(produce, num, unit){
  const d = new Date(produce);
  if(unit === "month") d.setMonth(d.getMonth() + Number(num));
  else d.setDate(d.getDate() + Number(num));
  return d;
}

function addItem(){
  const name = document.getElementById("name").value.trim();
  const pDate = document.getElementById("produceDate").value;
  const sNum = Number(document.getElementById("shelfNum").value);
  const unit = document.getElementById("unit").value;
  if(!name || !pDate || !sNum){
    alert("请填全：商品名、生产日期、保质期！");
    return;
  }
  const endDate = calcEnd(pDate, sNum, unit);
  const list = getList();
  list.push({
    name,
    produce:pDate,
    shelfNum:sNum,
    unit,
    end: endDate.toISOString()
  });
  save(list);
  document.getElementById("name").value="";
  document.getElementById("produceDate").value="";
  document.getElementById("shelfNum").value="";
  render();
}

function openEdit(index){
  editIndex = index;
  render();
}

function saveEdit(){
  const list = getList();
  const name = document.getElementById("edit-name").value.trim();
  const pDate = document.getElementById("edit-produceDate").value;
  const sNum = Number(document.getElementById("edit-shelfNum").value);
  const unit = document.getElementById("edit-unit").value;
  if(!name || !pDate || !sNum){
    alert("信息不能为空！");
    return;
  }
  const endDate = calcEnd(pDate, sNum, unit);
  list[editIndex] = {
    name,
    produce:pDate,
    shelfNum:sNum,
    unit,
    end: endDate.toISOString()
  };
  save(list);
  editIndex = null;
  render();
}

function cancelEdit(){
  editIndex = null;
  render();
}

function del(idx){
  const arr = getList();
  arr.splice(idx,1);
  save(arr);
  render();
}

function render(){
  const now = new Date();
  const list = getList();
  const warnDom = document.getElementById("warnList");
  const allDom = document.getElementById("allList");
  warnDom.innerHTML = "";
  allDom.innerHTML = "";

  list.forEach((row, index)=>{
    const end = new Date(row.end);
    const diffTime = end.getTime() - now.getTime();
    const diffDay = Math.ceil(diffTime/(1000*3600*24));
    const isWarn = diffDay <= 30;

    let tipText = "";
    if(diffDay > 0){
      tipText = `剩余 ${diffDay} 天到期`;
    }else{
      tipText = `<span style="color:red">❗已过期 ${Math.abs(diffDay)} 天</span>`;
    }

    if(editIndex === index){
      const html=`
      <div class="edit-form">
        <input placeholder="商品名称" id="edit-name" value="${row.name}">
        <input type="date" id="edit-produceDate" value="${row.produce}">
        <input type="number" placeholder="保质期时长" id="edit-shelfNum" min="1" value="${row.shelfNum}">
        <select id="edit-unit">
          <option value="month" ${row.unit==='month'?'selected':''}>月</option>
          <option value="day" ${row.unit==='day'?'selected':''}>天</option>
        </select>
        <button class="btn-save" onclick="saveEdit()">保存修改</button>
        <button class="btn-cancel" onclick="cancelEdit()">取消</button>
      </div>
      `;
      allDom.innerHTML += html;
    }else{
      const html=`
      <div class="${isWarn ? 'warn-item':'normal-item'}">
        <div><b>${row.name}</b></div>
        <div>生产日期：${row.produce}</div>
        <div>保质期：${row.shelfNum} ${row.unit==="month"?"个月":"天"}</div>
        <div>到期日期：${end.toLocaleDateString()}</div>
        <div>${tipText}</div>
        <div class="btn-row">
          <button class="btn-edit" onclick="openEdit(${index})">编辑</button>
          <button class="btn-del" onclick="del(${index})">删除</button>
        </div>
      </div>
      `;
      if(isWarn) warnDom.innerHTML += html;
      allDom.innerHTML += html;
    }
  })

  if(warnDom.innerHTML === "") warnDom.innerHTML = "<div class='empty'>暂无即将到期商品 ✅</div>";
  if(allDom.innerHTML === "") allDom.innerHTML = "<div class='empty'>暂无商品记录，请添加零食</div>";
}

render();
</script>
</body>
</html>
